plugins {
    alias(libs.plugins.android.application)
    id("com.google.gms.google-services")
}

android {
    namespace 'lk.menara.studysphere'
    compileSdk 36

    defaultConfig {
        applicationId "lk.menara.studysphere"
        minSdk 28
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    buildFeatures {
        viewBinding true
        dataBinding true
    }
}

dependencies {

    implementation libs.appcompat.v161
    implementation 'com.google.android.material:material:1.11.0'
    implementation libs.constraintlayout.v214
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
    implementation libs.activity.v182

    implementation libs.circleimageview

    implementation 'com.github.bumptech.glide:glide:4.16.0'
    implementation libs.places

    implementation 'com.google.android.gms:play-services-maps:18.2.0'
    implementation 'com.google.android.gms:play-services-location:21.0.1'

    // Firebase
    implementation(platform("com.google.firebase:firebase-bom:34.9.0"))
    implementation 'com.google.firebase:firebase-auth'
    implementation("com.google.firebase:firebase-analytics")
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.firebase:firebase-storage:20.3.0'
    implementation("com.google.firebase:firebase-appcheck-playintegrity")

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    implementation "androidx.cardview:cardview:1.0.0"
    implementation 'com.tbuonomo:dotsindicator:5.0'

    // OkHttp
    implementation 'com.squareup.okhttp3:okhttp:4.11.0'

    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'

    // Lombok
    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'

    //payhere
    implementation 'com.github.PayHereDevs:payhere-android-sdk:v3.0.18'
    implementation 'com.google.code.gson:gson:2.8.0'

    implementation 'com.itextpdf:itext7-core:7.2.5'

    implementation 'com.android.volley:volley:1.2.1'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation libs.threetenabp
    implementation libs.firebase.messaging
    implementation libs.lottie
    
    // Credential Manager සහ Google ID Library
    implementation(libs.androidx.credentials)
    implementation(libs.androidx.credentials.credentials.play.services.auth)
    implementation(libs.google.googleid)

}